name: Rumor Recheck

on:
  schedule:
    # Weekly, Mondays at 19:00 UTC (3am SGT) — an hour after the daily scrape window.
    - cron: '0 19 * * 1'
  workflow_dispatch:

concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Recheck stale rumors
        id: recheck
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
        run: npm run rumors:recheck

      - name: Apply recheck results to layoffs.csv
        id: apply
        if: steps.recheck.outcome == 'success'
        run: npm run rumors:apply

      - name: Dedup layoffs.csv
        id: dedup
        if: steps.apply.outcome == 'success'
        run: npm run dedup

      # Gate the auto-commit on validation, mirroring the scheduled-scrape workflow: fail
      # rather than commit corruption if the rechecked data has hard errors.
      - name: Validate data integrity
        id: validate
        run: npm run validate -- --baseline HEAD

      - name: Set commit date
        id: meta
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit results to main
        if: steps.validate.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: >-
            data/layoffs.csv
            data/rumor-recheck-results.csv
          commit_message: "rumors: recheck stale rumored rows (${{ steps.meta.outputs.date }})"
