name: LLM Evals

on:
  push:
    # Gate only on changes that actually affect LLM classification — the eval
    # depends on a live external model, so gating every scripts/** or data push
    # blocks unrelated commits (e.g. data ingests) on model drift they didn't cause.
    paths:
      - 'scripts/llm-evals.ts'
      - 'scripts/llm-triage.ts'
      - 'scripts/llm-provider.ts'
      - 'src/lib/verdict.ts'
      - 'src/lib/types.ts'
      - 'data/eval-golden.json'
      - '.github/workflows/llm-evals.yml'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run golden eval (gated — frozen curated set)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: npm run eval:golden

      - name: Run sampled eval (broad coverage over current data)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: npm run eval:llm
