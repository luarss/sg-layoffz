name: Unit Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Validate data integrity
        run: npm run validate
