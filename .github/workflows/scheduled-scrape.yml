name: Scheduled Scrape

on:
  schedule:
    # Daily at 08:00 UTC (4pm SGT)
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape Google News
        id: scrape_news
        continue-on-error: true
        run: npx tsx scripts/scrape-google-news.ts

      - name: Scrape source websites
        id: scrape_sources
        continue-on-error: true
        run: npx tsx scripts/scrape-sources.ts

      - name: Scrape Exa
        id: scrape_exa
        continue-on-error: true
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: npx tsx scripts/scrape-exa.ts

      - name: Count queue entries
        id: count
        run: |
          echo "count=$(tail -n +2 data/review-queue.csv | grep -c '^' || echo 0)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: scrape/daily
          delete-branch: true
          add-paths: |
            data/review-queue.csv
            data/exa-budget.json
          commit-message: "scrape: add candidates to review queue (${{ steps.count.outputs.date }})"
          title: "scrape: new review queue candidates (${{ steps.count.outputs.date }})"
          body: |
            ## Automated Scrape Results

            Review queue currently has **${{ steps.count.outputs.count }}** entries.

            ### How to review

            1. Checkout this branch:
               ```
               git fetch origin && git checkout scrape/daily
               ```
            2. Install deps and run the interactive review:
               ```
               npm ci && npm run review
               ```
            3. After reviewing, commit and push:
               ```
               git add data/layoffs.csv data/review-queue.csv data/rejected.csv
               git commit -m "review: process review queue ($(date +%Y-%m-%d))"
               git push
               ```
            4. Merge this PR — Vercel will auto-deploy.

      - name: Warn if queue is large
        if: steps.cpr.outputs.pull-request-number && fromJSON(steps.count.outputs.count) > 30
        run: echo "::warning::Review queue has ${{ steps.count.outputs.count }} entries. Consider reviewing soon."

      - name: Report no new entries
        if: steps.cpr.outputs.pull-request-operation == 'none' || steps.cpr.outputs.pull-request-operation == ''
        run: echo "No new layoff candidates found today."

      - name: Report scraper failures
        if: failure() || steps.scrape_news.outcome == 'failure' || steps.scrape_sources.outcome == 'failure' || steps.scrape_exa.outcome == 'failure'
        run: |
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ]; then
            echo "::warning::Google News scraper failed"
          fi
          if [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::warning::Source website scraper failed"
          fi
          if [ "${{ steps.scrape_exa.outcome }}" = "failure" ]; then
            echo "::warning::Exa scraper failed"
          fi
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ] && [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::error::Both RSS scrapers failed"
            exit 1
          fi
