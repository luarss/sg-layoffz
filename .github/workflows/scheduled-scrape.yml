name: Scheduled Scrape

on:
  schedule:
    # Daily at 08:00 UTC (4pm SGT)
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape Google News
        id: scrape_news
        continue-on-error: true
        run: npx tsx scripts/scrape-google-news.ts

      - name: Scrape source websites
        id: scrape_sources
        continue-on-error: true
        run: npx tsx scripts/scrape-sources.ts

      - name: Check for new entries
        id: check_diff
        run: |
          if git diff --exit-code data/review-queue.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No new entries in review queue."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New entries detected in review queue."
          fi

      - name: Count queue entries
        id: count
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          COUNT=$(tail -n +2 data/review-queue.csv | grep -c '^' || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Review queue has $COUNT entries."

      - name: Warn if queue is large
        if: steps.check_diff.outputs.changed == 'true' && fromJSON(steps.count.outputs.count) > 30
        run: |
          echo "::warning::Review queue has ${{ steps.count.outputs.count }} entries. Consider reviewing soon."

      - name: Create branch and commit
        id: commit
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="scrape/${DATE}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Check if branch already exists on remote
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH already exists, fetching..."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git merge origin/main --no-edit
          else
            git checkout -b "$BRANCH"
          fi

          git add data/review-queue.csv
          git commit -m "scrape: add ${{ steps.count.outputs.count }} candidates to review queue (${DATE})"
          git push -u origin "$BRANCH"

      - name: Check if PR already exists
        id: pr_check
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "number=$EXISTING" >> $GITHUB_OUTPUT
            echo "PR #$EXISTING already exists for this branch."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create PR
        if: steps.check_diff.outputs.changed == 'true' && steps.pr_check.outputs.exists != 'true'
        run: |
          cat > pr-body.md << 'ENDOFBODY'
          ## Automated Scrape Results

          Found **COUNT_PLACEHOLDER** new candidate(s) in the review queue.

          ### How to review

          1. Checkout this branch:
             ```
             git fetch origin && git checkout BRANCH_PLACEHOLDER
             ```
          2. Install deps and run the interactive review:
             ```
             npm ci && npm run review
             ```
          3. After reviewing, commit and push:
             ```
             git add data/layoffs.csv data/review-queue.csv data/rejected.csv
             git commit -m "review: process review queue ($(date +%Y-%m-%d))"
             git push
             ```
          4. Merge this PR — Vercel will auto-deploy.
          ENDOFBODY

          sed -i "s/COUNT_PLACEHOLDER/${{ steps.count.outputs.count }}/g" pr-body.md
          sed -i "s|BRANCH_PLACEHOLDER|${{ steps.commit.outputs.branch }}|g" pr-body.md

          gh pr create \
            --title "scrape: new review queue candidates ($(date +%Y-%m-%d))" \
            --body-file pr-body.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report no new entries
        if: steps.check_diff.outputs.changed != 'true'
        run: echo "No new layoff candidates found today."

      - name: Report scraper failures
        if: failure() || steps.scrape_news.outcome == 'failure' || steps.scrape_sources.outcome == 'failure'
        run: |
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ]; then
            echo "::warning::Google News scraper failed"
          fi
          if [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::warning::Source website scraper failed"
          fi
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ] && [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::error::Both scrapers failed"
            exit 1
          fi
