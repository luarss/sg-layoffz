name: Scheduled Scrape

on:
  schedule:
    # Daily at 18:00 UTC (2am SGT)
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape Google News
        id: scrape_news
        continue-on-error: true
        run: npx tsx scripts/scrape-google-news.ts

      - name: Scrape source websites
        id: scrape_sources
        continue-on-error: true
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
        run: npx tsx scripts/scrape-sources.ts

      - name: Scrape Exa
        id: scrape_exa
        continue-on-error: true
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
        run: npx tsx scripts/scrape-exa.ts

      - name: Ingest layoffsg.com
        id: scrape_layoffsg
        continue-on-error: true
        run: npx tsx scripts/scrape-lsg.ts

      - name: LLM Triage
        id: llm_triage
        continue-on-error: true
        # Backstop above the script's own 45-min wall-clock budget (TRIAGE_BUDGET_MS).
        # The script flushes partial progress and exits cleanly first; this only fires
        # if that logic fails, and still leaves time for dedup/validate/commit.
        timeout-minutes: 50
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: npx tsx scripts/llm-triage.ts

      - name: Dedup layoffs.csv
        id: dedup
        if: steps.llm_triage.outcome == 'success'
        run: npm run dedup

      # Gate the auto-commit on validation. Hard errors (bad status, malformed rows,
      # missing required fields) fail the job, and so does any integrity warning that
      # is new relative to HEAD (e.g. a new double-count or a new unrecognised-source
      # confirmed row). Warnings already present at HEAD do not block the commit.
      - name: Validate data integrity
        id: validate
        run: npm run validate -- --baseline HEAD

      - name: Read triage results
        id: triage_result
        if: steps.llm_triage.outcome == 'success'
        run: |
          remaining=$(jq '.remaining_queue' data/llm-triage-summary.json)
          confirmed=$(jq '.confirmed' data/llm-triage-summary.json)
          rumored=$(jq '.rumored' data/llm-triage-summary.json)
          rejected=$(jq '.rejected' data/llm-triage-summary.json)
          providers=$(jq -r '[.providers[].name] | join(" → ")' data/llm-triage-summary.json)
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          echo "rumored=$rumored" >> "$GITHUB_OUTPUT"
          echo "rejected=$rejected" >> "$GITHUB_OUTPUT"
          echo "providers=$providers" >> "$GITHUB_OUTPUT"

      - name: Count queue entries
        id: count
        run: |
          echo "count=$(tail -n +2 data/review-queue.csv | grep -c '^' || echo 0)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit results to main
        if: steps.validate.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: >-
            data/review-queue.csv
            data/layoffs.csv
            data/rejected.csv
            data/exa-budget.json
            data/llm-triage-summary.json
          commit_message: "review: classify scrape/daily candidates — ${{ steps.triage_result.outputs.confirmed || 0 }} confirmed, ${{ steps.triage_result.outputs.rumored || 0 }} rumored, ${{ steps.triage_result.outputs.rejected || 0 }} rejected (${{ steps.count.outputs.date }})"

      - name: Warn if queue is large
        if: fromJSON(steps.count.outputs.count) > 30
        run: echo "::warning::Review queue has ${{ steps.count.outputs.count }} entries. Consider reviewing soon."

      - name: Report scraper failures
        if: failure() || steps.scrape_news.outcome == 'failure' || steps.scrape_sources.outcome == 'failure' || steps.scrape_exa.outcome == 'failure' || steps.scrape_layoffsg.outcome == 'failure'
        run: |
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ]; then
            echo "::warning::Google News scraper failed"
          fi
          if [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::warning::Source website scraper failed"
          fi
          if [ "${{ steps.scrape_exa.outcome }}" = "failure" ]; then
            echo "::warning::Exa scraper failed"
          fi
          if [ "${{ steps.scrape_layoffsg.outcome }}" = "failure" ]; then
            echo "::warning::layoffsg.com ingestion failed"
          fi
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ] && [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::error::Both RSS scrapers failed"
            exit 1
          fi
