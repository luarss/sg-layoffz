name: Scheduled Scrape

on:
  schedule:
    # Daily at 08:00 UTC (4pm SGT)
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Scrape Google News
        id: scrape_news
        continue-on-error: true
        run: npx tsx scripts/scrape-google-news.ts

      - name: Scrape source websites
        id: scrape_sources
        continue-on-error: true
        run: npx tsx scripts/scrape-sources.ts

      - name: Scrape Exa
        id: scrape_exa
        continue-on-error: true
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: npx tsx scripts/scrape-exa.ts

      - name: LLM Triage
        id: llm_triage
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_BASE_URL: ${{ secrets.MIMO_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: npx tsx scripts/llm-triage.ts

      - name: Read triage results
        id: triage_result
        if: steps.llm_triage.outcome == 'success'
        run: |
          remaining=$(jq '.remaining_queue' data/llm-triage-summary.json)
          confirmed=$(jq '.confirmed' data/llm-triage-summary.json)
          rumored=$(jq '.rumored' data/llm-triage-summary.json)
          rejected=$(jq '.rejected' data/llm-triage-summary.json)
          providers=$(jq -r '[.providers[].name] | join(" → ")' data/llm-triage-summary.json)
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          echo "rumored=$rumored" >> "$GITHUB_OUTPUT"
          echo "rejected=$rejected" >> "$GITHUB_OUTPUT"
          echo "providers=$providers" >> "$GITHUB_OUTPUT"

      - name: Count queue entries
        id: count
        run: |
          echo "count=$(tail -n +2 data/review-queue.csv | grep -c '^' || echo 0)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: scrape/daily
          delete-branch: true
          add-paths: |
            data/review-queue.csv
            data/layoffs.csv
            data/rejected.csv
            data/exa-budget.json
            data/llm-triage-summary.json
          commit-message: "review: classify scrape/daily candidates — ${{ steps.triage_result.outputs.confirmed || 0 }} confirmed, ${{ steps.triage_result.outputs.rumored || 0 }} rumored, ${{ steps.triage_result.outputs.rejected || 0 }} rejected (${{ steps.count.outputs.date }})"
          title: "review: classify scrape/daily candidates (${{ steps.count.outputs.date }})"
          body: |
            ## Automated Scrape & LLM Triage Results

            | | Count |
            |---|---|
            | Confirmed | ${{ steps.triage_result.outputs.confirmed || '—' }} |
            | Rumored | ${{ steps.triage_result.outputs.rumored || '—' }} |
            | Rejected | ${{ steps.triage_result.outputs.rejected || '—' }} |
            | Needs review | ${{ steps.count.outputs.count }} |

            **Model:** `${{ steps.triage_result.outputs.providers || 'n/a' }}`
            ${{ steps.llm_triage.outcome == 'failure' && '> ⚠️ LLM triage failed — all entries kept in queue for manual review.' || '' }}

            ${{ steps.count.outputs.count != '0' && '### Remaining entries need manual review' || '✅ All entries classified — PR will auto-merge.' }}

            ${{ steps.count.outputs.count != '0' && '```\ngit fetch origin && git checkout scrape/daily\nnpm ci && npm run review\ngit add data/layoffs.csv data/review-queue.csv data/rejected.csv\ngit commit -m "review: process review queue ($(date +%Y-%m-%d))"\ngit push\n```' || '' }}

      - name: Auto-merge PR
        if: |
          steps.cpr.outputs.pull-request-number &&
          steps.triage_result.outputs.remaining == '0' &&
          steps.llm_triage.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} \
            --squash \
            --title "review: classify scrape/daily candidates (${{ steps.count.outputs.date }})" \
            --body "Auto-merged by LLM triage (${{ steps.triage_result.outputs.providers }}): ${{ steps.triage_result.outputs.confirmed }} confirmed, ${{ steps.triage_result.outputs.rumored }} rumored, ${{ steps.triage_result.outputs.rejected }} rejected."

      - name: Warn if queue is large
        if: steps.cpr.outputs.pull-request-number && fromJSON(steps.count.outputs.count) > 30
        run: echo "::warning::Review queue has ${{ steps.count.outputs.count }} entries. Consider reviewing soon."

      - name: Report no new entries
        if: steps.cpr.outputs.pull-request-operation == 'none' || steps.cpr.outputs.pull-request-operation == ''
        run: echo "No new layoff candidates found today."

      - name: Report scraper failures
        if: failure() || steps.scrape_news.outcome == 'failure' || steps.scrape_sources.outcome == 'failure' || steps.scrape_exa.outcome == 'failure'
        run: |
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ]; then
            echo "::warning::Google News scraper failed"
          fi
          if [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::warning::Source website scraper failed"
          fi
          if [ "${{ steps.scrape_exa.outcome }}" = "failure" ]; then
            echo "::warning::Exa scraper failed"
          fi
          if [ "${{ steps.scrape_news.outcome }}" = "failure" ] && [ "${{ steps.scrape_sources.outcome }}" = "failure" ]; then
            echo "::error::Both RSS scrapers failed"
            exit 1
          fi
